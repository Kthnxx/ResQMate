<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQMate – Categories</title>
  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/admin-shared.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dashboard-container">
    <div id="sidebar-container"></div>
    <div id="logout-modal-wrapper"></div>
    <main class="main-content">
      <div class="topbar">
        <h2>Assistance Categories</h2>
        <p>Manage categories available for assistance requests</p>
      </div>

      <div class="table-card">
        <div class="toolbar-row">
          <h5 style="margin:0;color:#7f1d1d;font-weight:700;flex:1;">All Categories</h5>
          <button class="btn-primary" id="addCategoryBtn"><i class="fa-solid fa-plus"></i> Add Category</button>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:16px; padding-top:8px;" id="categoriesGrid">
          <div class="rq-feature-card"><span class="icon">🍚</span><div class="label">Food</div><div class="count">124 requests</div><button class="rq-btn-delete" style="margin-top:12px;">Remove</button></div>
          <div class="rq-feature-card"><span class="icon">💧</span><div class="label">Water</div><div class="count">89 requests</div><button class="rq-btn-delete" style="margin-top:12px;">Remove</button></div>
          <div class="rq-feature-card"><span class="icon">🏠</span><div class="label">Shelter</div><div class="count">67 requests</div><button class="rq-btn-delete" style="margin-top:12px;">Remove</button></div>
          <div class="rq-feature-card"><span class="icon">💊</span><div class="label">Medicine</div><div class="count">62 requests</div><button class="rq-btn-delete" style="margin-top:12px;">Remove</button></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Category Modal -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-header-row">
        <h4>Add Category</h4>
        <button class="modal-close-btn" id="closeCategoryModal"><i class="fa-solid fa-times"></i></button>
      </div>
      <div class="form-group"><label>Category Name</label><input type="text" id="categoryName" placeholder="e.g. Clothing"></div>
      <div class="form-group"><label>Icon (emoji)</label><input type="text" id="categoryIcon" placeholder="e.g. 👕" maxlength="4"></div>
      <div class="form-group"><label>Description</label><textarea id="categoryDesc" rows="3" placeholder="Brief description…"></textarea></div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelCategoryModal">Cancel</button>
        <button class="btn-primary" id="saveCategoryBtn">Add Category</button>
      </div>
    </div>
  </div>

  <script src="../components/loadAdminSidebar.js"></script>
  <script src="../components/logout-modal.js"></script>
  <script>
    const catModal = document.getElementById('categoryModal');
    document.getElementById('addCategoryBtn').addEventListener('click', () => catModal.classList.add('active'));
    document.getElementById('closeCategoryModal').addEventListener('click', () => catModal.classList.remove('active'));
    document.getElementById('cancelCategoryModal').addEventListener('click', () => catModal.classList.remove('active'));
    catModal.addEventListener('click', e => { if (e.target === catModal) catModal.classList.remove('active'); });

    document.getElementById('saveCategoryBtn').addEventListener('click', () => {
      const name = document.getElementById('categoryName').value.trim();
      const icon = document.getElementById('categoryIcon').value.trim() || '📦';
      if (!name) return;
      const grid = document.getElementById('categoriesGrid');
      const card = document.createElement('div');
      card.className = 'rq-feature-card';
      card.innerHTML = `<span class="icon">${icon}</span><div class="label">${name}</div><div class="count">0 requests</div><button class="rq-btn-delete" style="margin-top:12px;" onclick="this.closest('.rq-feature-card').remove()">Remove</button>`;
      grid.appendChild(card);
      catModal.classList.remove('active');
      document.getElementById('categoryName').value = '';
      document.getElementById('categoryIcon').value = '';
      document.getElementById('categoryDesc').value = '';
    });

    document.querySelectorAll('.rq-btn-delete').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.rq-feature-card').remove());
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResQMate – Profile</title>
  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/admin-shared.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="dashboard-container">
    <div id="sidebar-container"></div>
    <div id="logout-modal-wrapper"></div>
    <main class="main-content">
      <div class="topbar">
        <h2>Profile</h2>
        <p>View and update your administrator account</p>
      </div>

      <div style="display:grid; grid-template-columns:300px 1fr; gap:20px;">

        <div class="table-card" style="text-align:center; padding:32px 24px;">
          <div style="width:80px;height:80px;border-radius:50%;background:#ef4444;color:#fff;font-size:2rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;" id="profileAvatarLarge">A</div>
          <h4 style="color:#1e293b;font-weight:700;margin-bottom:4px;" id="profileDisplayName">Administrator</h4>
          <span class="rq-badge rq-badge-admin">Admin</span>
          <p style="font-size:12px;color:#9ca3af;margin-top:12px;" id="profileDisplayEmail">admin@resqmate.com</p>
        </div>

        <div class="table-card">
          <h5 style="color:#7f1d1d;margin-bottom:20px;">Account Details</h5>
          <div class="form-group"><label>Full Name</label><input type="text" id="profileFullName" value="Administrator" class="rq-input" style="width:100%;"></div>
          <div class="form-group"><label>Email</label><input type="email" id="profileEmail" value="admin@resqmate.com" class="rq-input" style="width:100%;"></div>
          <div class="form-group"><label>Role</label><input type="text" value="Administrator" class="rq-input" style="width:100%;" disabled></div>
          <div class="form-group"><label>New Password</label><input type="password" id="profilePassword" placeholder="Leave blank to keep current" class="rq-input" style="width:100%;"></div>
          <button class="btn-primary" onclick="saveProfile()"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </div>

      </div>
    </main>
  </div>
  <script src="../components/loadAdminSidebar.js"></script>
  <script src="../components/logout-modal.js"></script>
  <script>
    function saveProfile() {
      const name  = document.getElementById('profileFullName').value.trim();
      const email = document.getElementById('profileEmail').value.trim();
      if (!name || !email) { alert('Please fill in required fields.'); return; }
      document.getElementById('profileDisplayName').textContent = name;
      document.getElementById('profileDisplayEmail').textContent = email;
      document.getElementById('profileAvatarLarge').textContent = name.charAt(0).toUpperCase();
      alert('Profile updated! (Changes will persist when connected to the backend API.)');
    }
  </script>
</body>
</html>

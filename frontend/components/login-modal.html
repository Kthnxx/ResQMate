<div class="modal" id="loginModal">

    <div class="login-container">

        <!-- Left Panel -->
        <div class="login-left">

            <div class="overlay">

                <div class="brand">
                </div>

                <div class="login-left-content">
                    <h1>
                        Together We
                        Build Safer
                        Communities
                    </h1>

                    <p>
                        Disaster relief is not just about
                        supplies, it's about people.
                    </p>
                </div>

            </div>

        </div>

        <!-- Right Panel -->
        <div class="login-right">

            <span class="close-btn">&times;</span>

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Log in to your account to continue
            </p>

            <div id="loginError" class="error-alert">
                Invalid Credentials
            </div>

            <form id="loginForm" novalidate>

                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>

                <div class="login-password-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye login-toggle-password toggle-password" data-target="password"></i>
                </div>

                <button type="submit" class="login-submit">
                    Login
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="create-account" href="#" id="openRegisterLink">

                    Create an Account
                </button>

                <div class="login-options">
                    <div class="forgot-password-text">
                        <p><strong>Forgot Password?</strong></p>
                        <p>
                            Please contact an administrator to reset your account password.
                        </p>
                        <p>
                            <strong>Email:</strong> resqmate@gmail.com
                        </p>
                    </div>


            </form>

        </div>

    </div>

</div>

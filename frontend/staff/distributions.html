<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Distributions</title>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="../style/customer-sidebar.css">
    <link rel="stylesheet" href="../style/logout-modal.css">

    <!-- Page Style -->
    <link rel="stylesheet" href="../style/staff-distributions.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="dashboard-container">

        <!-- Reusable Sidebar -->
        <div id="sidebar-container"></div>

        <main class="main-content">

            <!-- Topbar -->
            <div class="topbar">

                <div>
                    <h2>Distributions</h2>
                    <p>
                        Manage relief resource distributions
                    </p>
                </div>

            </div>

            <!-- Distribution Table Card -->
            <div class="table-card">

                <div class="distribution-header">

                    <button id="openModalBtn" class="btn btn-primary">

                        <i class="fas fa-plus"></i>
                        New Distribution

                    </button>

                </div>

                <!-- Search -->
                <div class="distribution-search">

                    <input type="text" id="searchInput" class="rq-input" placeholder="Search distributions..." />

                </div>

                <!-- Success / Error Message -->
                <div id="messageBox"></div>

                <!-- Table -->
                <div class="table-responsive">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>REQUEST</th>
                                <th>RESOURCE</th>
                                <th>STAFF</th>
                                <th>QUANTITY</th>
                                <th>DATE</th>
                                <th>ACTION</th>

                            </tr>

                        </thead>

                        <tbody id="distributionTableBody">

                            <tr>

                                <td colspan="7">

                                    Loading distributions...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- Reusable Logout Modal -->
    <div id="logout-modal-wrapper"></div>

    <!-- Distribution Modal -->
    <div class="modal-overlay" id="distributionModal">

        <div class="distribution-modal">

            <div class="modal-header">

                <h3>New Distribution</h3>

                <button class="close-btn" id="closeModalBtn" aria-label="Close Modal">
                    <i class="fas fa-times"></i>
                </button>

            </div>

            <form id="distributionForm">

                <div class="form-group">
                    <label for="requestId">Request ID <span class="required-asterisk">*</span></label>
                    <input type="number" id="requestId" required>
                </div>

                <div class="form-group">
                    <label for="resourceId">Resource ID <span class="required-asterisk">*</span></label>
                    <input type="number" id="resourceId" required>
                </div>

                <div class="form-group">
                    <label for="staffId">Staff ID <span class="required-asterisk">*</span></label>
                    <input type="number" id="staffId" required>
                </div>

                <div class="form-group">
                    <label for="quantityGiven">Quantity Given <span class="required-asterisk">*</span></label>
                    <input type="number" id="quantityGiven" required>
                </div>

                <button type="submit" class="btn-submit">

                    Create Distribution

                </button>

            </form>

        </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



    <!-- Reusable Components -->
    <script src="../components/logout-modal.js"></script>
    <script src="../components/loadStaffSidebar.js"></script>

    <!-- Page Script -->
    <script src="../js/staff-distributions.js"></script>

</body>

</html>

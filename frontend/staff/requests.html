<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResQMate - Staff Requests</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="../style/staff-requests.css">
</head>

<body>

  <div class="dashboard-container">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Logout Modal -->
    <div id="logout-modal-wrapper"></div>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Topbar -->
      <div class="rq-topbar">

        <div>
          <h4 class="mb-0 fw-bold">
            Request Management
          </h4>

          <small class="text-muted">
            Manage and monitor assistance requests
          </small>
        </div>

      </div>

      <!-- Statistics -->
      <div class="row g-3 mb-4">

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Pending</h6>
            <h3 id="countPending">0</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Approved</h6>
            <h3 id="countApproved">0</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Processing</h6>
            <h3 id="countProcessing">0</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Completed</h6>
            <h3 id="countCompleted">0</h3>
          </div>
        </div>

      </div>

      <!-- Filters -->
      <div class="rq-card mb-4">

        <div class="row g-3">

          <div class="col-md-3">
            <input type="text" id="searchBar" class="form-control" placeholder="Search request...">
          </div>
          
          <div class="col-md-2">
            <select id="provinceFilter" class="form-select" aria-label="Filter by Province">
              <option value="all">All Provinces</option>
              <option value="Metro Manila">Metro Manila</option>
            </select>
          </div>
          
          <div class="col-md-2">
            <select id="cityFilter" class="form-select" aria-label="Filter by City">
              <option value="all">All Cities</option>
              <option value="Manila">Manila</option>
              <option value="Quezon City">Quezon City</option>
              <option value="Makati">Makati</option>
              <option value="Taguig">Taguig</option>
              <option value="Pasig">Pasig</option>
            </select>
          </div>

          <div class="col-md-3">
            <select id="statusFilter" class="form-select" aria-label="Filter selection" title="Filter selection">
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="processing">Processing</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="refreshBtn">
              Refresh
            </button>
          </div>

        </div>

      </div>

      <!-- Requests Table -->
      <div class="rq-card">

        <div class="table-responsive">

          <table class="table align-middle">

            <thead>

              <tr>
                <th>ID</th>
                <th>Requester</th>
                <th>Type</th>
                <th>Location</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>

            </thead>

            <tbody id="requestsTableBody">

              <tr>
                <td colspan="8" class="text-center py-4">
                  Loading requests...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

        <div id="emptyState" class="text-center py-5 d-none">
          <i class="bi bi-inbox fs-1 text-muted"></i>

          <p class="text-muted mt-3">
            No requests found.
          </p>
        </div>

      </div>

    </main>

  </div>

  <!-- View Request Modal -->
  <div class="modal fade" id="viewRequestModal" tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">
            Request Details
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body" id="requestDetailBody">
          Loading...
        </div>

      </div>

    </div>

  </div>

  <div class="custom-modal-overlay" id="requestModal">

    <div class="custom-modal">

      <div class="custom-modal-header">

        <h3>Request Details</h3>

        <button id="closeRequestModal" aria-label="Close Request Details">
          <i class="fas fa-times"></i>
        </button>

      </div>

      <div class="custom-modal-body" id="customRequestDetailBody"></div>

    </div>

  </div>

  </div>

  <!-- Reject Reason Modal -->
  <div class="custom-modal-overlay" id="rejectReasonModal" style="display: none;">
    <div class="custom-modal" style="max-width: 400px;">
      <div class="custom-modal-header">
        <h3 style="margin: 0; font-size: 1.1rem; color: #111827;">Reason for Rejection</h3>
        <button id="closeRejectModal" aria-label="Close Reject Modal" style="background: none; border: none; cursor: pointer;">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="custom-modal-body" style="padding: 1.5rem;">
        <div style="margin-bottom: 1rem;">
            <label for="rejectionReasonSelect" style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Select Reason</label>
            <select id="rejectionReasonSelect" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;">
                <option value="" disabled selected>-- Select a Reason --</option>
                <option value="Duplicate Request">Duplicate Request</option>
                <option value="Resource Unavailable">Resource Unavailable</option>
                <option value="Outside Jurisdiction">Outside Jurisdiction</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div id="otherReasonGroup" style="margin-bottom: 1.5rem; display: none;">
            <label for="otherReasonText" style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Specify Reason <span style="color: red;">*</span></label>
            <textarea id="otherReasonText" rows="3" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;"></textarea>
        </div>
        <button id="submitRejectionBtn" style="width: 100%; padding: 0.75rem; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
            Confirm Rejection
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Sidebar -->
  <script src="../components/loadStaffSidebar.js"></script>

  <!-- Logout -->
  <script src="../components/logout-modal.js"></script>

  <!-- Request Functions -->
  <script src="../js/staff-requests.js"></script>

  <!-- Search / Filter -->
  <script src="../js/app.js"></script>

</body>

</html>

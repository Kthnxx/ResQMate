<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResQMate - Staff Requests</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="../style/staff-requests.css">
</head>

<body>

  <div class="dashboard-container">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Logout Modal -->
    <div id="logout-modal-wrapper"></div>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Topbar -->
      <div class="rq-topbar">

        <div>
          <h4 class="mb-0 fw-bold">
            Request Management
          </h4>

          <small class="text-muted">
            Manage and monitor assistance requests
          </small>
        </div>

      </div>

      <!-- Statistics -->
      <div class="row g-3 mb-4">

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Pending</h6>
            <h3 id="countPending">0</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Approved</h6>
            <h3 id="countApproved">0</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Processing</h6>
            <h3 id="countProcessing">0</h3>
          </div>
        </div>

        <div class="col-md-3">
          <div class="rq-stat-card">
            <h6>Completed</h6>
            <h3 id="countCompleted">0</h3>
          </div>
        </div>

      </div>

      <!-- Filters -->
      <div class="rq-card mb-4">

        <div class="row g-3">

          <div class="col-md-5">
            <input type="text" id="searchBar" class="form-control" placeholder="Search request...">
          </div>

          <div class="col-md-3">
            <select id="statusFilter" class="form-select">
              <option value="all">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="processing">Processing</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div class="col-md-2">
            <button class="btn btn-primary w-100" id="refreshBtn">
              Refresh
            </button>
          </div>

        </div>

      </div>

      <!-- Requests Table -->
      <div class="rq-card">

        <div class="table-responsive">

          <table class="table align-middle">

            <thead>

              <tr>
                <th>ID</th>
                <th>Requester</th>
                <th>Type</th>
                <th>Location</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>

            </thead>

            <tbody id="requestsTableBody">

              <tr>
                <td colspan="8" class="text-center py-4">
                  Loading requests...
                </td>
              </tr>

            </tbody>

          </table>

        </div>

        <div id="emptyState" class="text-center py-5 d-none">
          <i class="bi bi-inbox fs-1 text-muted"></i>

          <p class="text-muted mt-3">
            No requests found.
          </p>
        </div>

      </div>

    </main>

  </div>

  <!-- View Request Modal -->
  <div class="modal fade" id="viewRequestModal" tabindex="-1">

    <div class="modal-dialog modal-lg modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">
            Request Details
          </h5>

          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body" id="requestDetailBody">
          Loading...
        </div>

      </div>

    </div>

  </div>

  <div class="custom-modal-overlay" id="requestModal">

    <div class="custom-modal">

      <div class="custom-modal-header">

        <h3>Request Details</h3>

        <button id="closeRequestModal">
          <i class="fas fa-times"></i>
        </button>

      </div>

      <div class="custom-modal-body" id="customRequestDetailBody"></div>

    </div>

  </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Sidebar -->
  <script src="../components/loadStaffSidebar.js"></script>

  <!-- Logout -->
  <script src="../components/logout-modal.js"></script>

  <!-- Request Functions -->
  <script src="../js/staff-requests.js"></script>

  <!-- Search / Filter -->
  <script src="../js/app.js"></script>

</body>

</html>

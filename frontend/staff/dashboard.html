<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Dashboard</title>

  <link rel="stylesheet" href="../style/customer-sidebar.css">
  <link rel="stylesheet" href="../style/logout-modal.css">
  <link rel="stylesheet" href="../style/staff-dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <div class="dashboard-container">

    <div id="sidebar-container"></div>
    

    <main class="main-content">

      <!-- Top Bar -->
      <div class="topbar">
        <div>
          <h2>
            Staff Dashboard
          </h2>

          <p>
            Manage requests and relief operations
          </p>
        </div>
      </div>

      <!-- Statistics -->

      <div class="stats-grid">

        <div class="stat-card">
          <h3>Total Requests</h3>
          <div id="totalRequests">
            0
          </div>
        </div>

        <div class="stat-card">
          <h3>Pending Requests</h3>
          <div id="pendingRequests">
            0
          </div>
        </div>

        <div class="stat-card">
          <h3>Distributions</h3>
          <div id="completedDistributions">
            0
          </div>
        </div>

        <div class="stat-card">
          <h3>Resources</h3>
          <div id="totalResources">
            0
          </div>
        </div>

      </div>

      <!-- Requests Table -->

      <div class="table-card">

        <h3>
          Recent Requests
        </h3>

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Priority</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="recentRequestsTable">
          </tbody>

        </table>

      </div>

    </main>

  </div>

  <div id="logout-modal-wrapper"></div>

  <script src="../components/logout-modal.js"></script>
  <script src="../components/loadStaffSidebar.js"></script>
  <script src="../js/staff-dashboard.js"></script>

</body>

</html>
